name: Publish to npm

# Runs when a GitHub Release is published, and only then. An npm version number
# is spent for good, so publishing belongs to the deliberate release step
# rather than to a push onto main.
#
# Set up once, in this order — the workflow below is the last step:
#
#   1. Bootstrap the package. A trusted publisher is configured on an existing
#      package's settings page, so the package has to exist first: publish it
#      once by hand (`npm login && npm publish`) and never again. A granular
#      token can do that first publish too, but npm is retiring direct
#      publishing with granular tokens in January 2027, so the manual route is
#      the one with no expiry.
#   2. Configure the trusted publisher: npmjs.com → Packages →
#      dsh-outsourcing-expert → Settings → Trusted publishing → GitHub Actions,
#      with repository Funny1Potato/dsh-outsourcing-expert and workflow
#      publish.yml — the file name only, extension included, and it has to be
#      this file inside .github/workflows/.
#   3. Nothing else. A published Release then publishes to npm through OIDC
#      with no secret stored anywhere, and npm attaches provenance itself.
#
# npm does not check the trusted-publisher configuration when it is saved: a
# wrong repository or file name surfaces as an authentication failure at the
# first publish, never at setup time.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI 11.21.0 or later, and the npm bundled
      # with Node 24 still reports 11.9.x. Whatever ships after this step is
      # source-only, so the CLI version changes nothing about the tarball.
      - name: Ensure an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # The release tag is the only claim about which version this commit is. A
      # mismatch means the release and the manifest disagree, and publishing
      # would put that disagreement on npm permanently.
      - name: Check the release tag matches the package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match package.json version '${version}'"
            exit 1
          fi
          echo "publishing ${version} at ${GITHUB_SHA}"

      - name: Contract tests
        run: node --test

      # A plain release passes no --tag, so it needs only the trusted
      # publisher's publish permission: setting `latest` is part of publishing.
      #
      # No NODE_AUTH_TOKEN here on purpose: the npm CLI exchanges the workflow's
      # OIDC token for a short-lived publish credential. To publish with a
      # granular token instead, add a repository secret NPM_TOKEN and add:
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --provenance --access public

      # A prerelease goes to the `next` dist-tag so it can never take over
      # `latest` for everyone installing by name. Managing dist-tags is a
      # separate permission on the trusted publisher — enable it there, or this
      # step fails with an authentication error.
      - name: Publish a prerelease to the next dist-tag
        if: ${{ github.event.release.prerelease }}
        run: npm publish --provenance --access public --tag next